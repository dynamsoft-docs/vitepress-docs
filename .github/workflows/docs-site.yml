# Reusable build/deploy job for Dynamsoft VitePress docs sites ( see README →
# Deployment)

name: Docs Site

on:
  workflow_call:
    inputs:
      deploy:
        description: >-
          Build every version designated in the docs version manifest via
          ds-docs-build-versions and FTP-deploy the assembled tree.
          Otherwise: verification build of the current ref only, uploaded
          as an artifact.
        type: boolean
        default: false
      beta:
        description: "With deploy: target the test site instead of www.dynamsoft.com."
        type: boolean
        default: false
      server-dir:
        description: "FTP deploy target, e.g. /www.dynamsoft.com/<product>/docs/web/."
        type: string
        required: true
      docs-dir:
        description: "Docs package directory within the repository."
        type: string
        default: docs
    # Declared explicitly (not `secrets: inherit`): callers live in other
    # organizations, and GitHub only propagates inherited secrets within
    # one org/enterprise — across orgs, inherit silently passes nothing.
    # All optional so verification-only callers need no secrets; deploy
    # runs need the pair matching their target.
    secrets:
      FTP_DYNAMSOFT_LOCAL_SERVER:
        description: "Production FTP host (deploy without beta)."
        required: false
      FTP_DYNAMSOFT_LOCAL_USER:
        required: false
      FTP_DYNAMSOFT_LOCAL_PASSWORD:
        required: false
      FTP_TEST_SITE_SERVER:
        description: "Test-site FTP host (deploy with beta)."
        required: false
      FTP_TEST_SITE_USER:
        required: false
      FTP_TEST_SITE_PASSWORD:
        required: false
      FTP_TEST_SITE_PORT:
        required: false

jobs:
  build:
    runs-on: [self-hosted, doc-build]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so every branch tracked by the version manifest can
          # be checked out and built.
          fetch-depth: 0

      # Installs Vite+, Node, and the package manager, with dependency
      # caching (vp docs → Continuous Integration).
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true

      # --- deploy: false — fast verification build of the current ref ---
      # Root install first: the API reference is typedoc-generated from the
      # product source, which resolves types from the root node_modules
      # (README → Setting up a docs site).
      - name: Install SDK dependencies
        if: ${{ !inputs.deploy }}
        run: vp install

      - name: Install docs dependencies
        if: ${{ !inputs.deploy }}
        run: vp install
        working-directory: ${{ inputs.docs-dir }}

      # The docs build script still invokes the `vitepress` CLI directly:
      # `vp doc` is not shipped in vite-plus 0.2.6 (the command exists but
      # dist/vitepress is absent) — see README → TODO.
      - name: Build docs site (typedoc + vitepress)
        if: ${{ !inputs.deploy }}
        run: vp run build
        working-directory: ${{ inputs.docs-dir }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.deploy }}
        with:
          name: docs-site
          path: ${{ inputs.docs-dir }}/.vitepress/dist/
          retention-days: 7

      # --- deploy: true — build every designated version ---
      # versions.json in the docs package designates the versions (README →
      # Versioning model); ds-docs-build-versions builds each tracked branch
      # in a detached git worktree and assembles the tree together with the
      # manifest (internally it shells npm ci / npm run build per worktree —
      # each branch's `vitepress build`, since `vp doc` is not shipped yet).
      # The same command works locally: npm run build:versions.
      # actions/checkout materializes sibling branches only as origin/*
      # remote refs, but ds-docs-build-versions resolves the manifest's
      # tracked branches by local name; give every remote branch a local
      # ref (--update-head-ok: the checked-out branch is a same-sha no-op).
      - name: Create local refs for tracked branches
        if: ${{ inputs.deploy }}
        run: git fetch --update-head-ok origin '+refs/heads/*:refs/heads/*'

      - name: Install docs dependencies (deploy)
        if: ${{ inputs.deploy }}
        run: vp install
        working-directory: ${{ inputs.docs-dir }}

      - name: Build all designated versions
        if: ${{ inputs.deploy }}
        run: vp exec ds-docs-build-versions --out "$GITHUB_WORKSPACE/_site"
        working-directory: ${{ inputs.docs-dir }}

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.deploy }}
        with:
          name: docs-site-all${{ inputs.beta && '-beta' || '' }}
          path: _site/
          retention-days: 7

      # FTP-sync the assembled tree to the IIS server
      - name: Deploy to production (www.dynamsoft.com)
        if: ${{ inputs.deploy && !inputs.beta }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_DYNAMSOFT_LOCAL_SERVER }}
          username: ${{ secrets.FTP_DYNAMSOFT_LOCAL_USER }}
          password: ${{ secrets.FTP_DYNAMSOFT_LOCAL_PASSWORD }}
          local-dir: _site/
          server-dir: ${{ inputs.server-dir }}

      - name: Deploy to beta (test site)
        if: ${{ inputs.deploy && inputs.beta }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_TEST_SITE_SERVER }}
          username: ${{ secrets.FTP_TEST_SITE_USER }}
          password: ${{ secrets.FTP_TEST_SITE_PASSWORD }}
          port: ${{ secrets.FTP_TEST_SITE_PORT }}
          local-dir: _site/
          server-dir: ${{ inputs.server-dir }}
